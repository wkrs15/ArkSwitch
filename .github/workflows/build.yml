name: build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 核心逻辑测试（账号备份/切换、配置、切服文件复制），全部使用临时目录
      - name: Run core tests
        run: dotnet run --project tests/ArkSwitch.Tests -c Release -- --fake

      # 仓库不含游戏资源（load/），构建产物同样不含；
      # 用户首次运行时由软件从官方 CDN 自动下载切服文件
      - name: Publish
        run: dotnet publish ArkSwitch.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:PublishDir=publish

      - name: Package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME } else { $v = "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          Compress-Archive -Path "publish/ArkSwitch.exe" -DestinationPath "ArkSwitch-$v-win-x64.zip"
          "ZIP_NAME=ArkSwitch-$v-win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArkSwitch-win-x64
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          # 从 CHANGELOG.md 提取当前标签对应的更新日志作为 Release 说明
          $notes = "release-notes.md"
          if (Test-Path "CHANGELOG.md") {
            $content = Get-Content "CHANGELOG.md" -Raw
            $match = [regex]::Match($content, "(?s)##\s+$([regex]::Escape($tag))\r?\n(.*?)(?=\r?\n##\s|\z)")
            if ($match.Success -and $match.Groups[1].Value.Trim()) {
              Set-Content -Path $notes -Value $match.Groups[1].Value.Trim() -Encoding utf8
            }
          }
          if (Test-Path $notes) {
            gh release create "$tag" "$env:ZIP_NAME" --title "ArkSwitch $tag" --notes-file $notes
          } else {
            gh release create "$tag" "$env:ZIP_NAME" --title "ArkSwitch $tag" --generate-notes
          }
