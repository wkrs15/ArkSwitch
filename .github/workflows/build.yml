name: build

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 仓库不含游戏资源（load/），构建产物同样不含；
      # 用户首次运行时由软件从官方 CDN 自动下载切服文件
      - name: Publish
        run: dotnet publish ArkSwitch.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishDir=publish

      - name: Package
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME } else { $v = "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          Compress-Archive -Path "publish/ArkSwitch.exe" -DestinationPath "ArkSwitch-$v-win-x64.zip"
          "ZIP_NAME=ArkSwitch-$v-win-x64.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArkSwitch-win-x64
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "$env:ZIP_NAME" --title "ArkSwitch $env:GITHUB_REF_NAME" --generate-notes
